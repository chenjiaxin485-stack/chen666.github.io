<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>音乐</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aplayer/dist/APlayer.min.css">
<style>
    body{max-width:720px;margin:40px auto;padding:0 16px;font-family:-apple-system,sans-serif;line-height:1.5;background:#ffd6e7;color:#4a2631;}
    h1{font-size:28px;margin-bottom:4px;}
    .tip{color:#9a6b7c;font-size:14px;margin-bottom:20px;}
</style>
</head>
<body>
<h1>&#9834; 音乐</h1>
<div class="tip">点击下方播放按钮即可收听。</div>

<!-- 单曲：id 换成你想收听的网易云歌曲 ID（歌曲地址 ?id= 后面的数字） -->
<meting-js
    server="netease"
    type="song"
    id="5255631"
    api="https://api.injahow.cn/meting/?server=netease"
    fixed="false"
    mini="false"
    autoplay="false"
    preload="auto"
    volume="0.7">
</meting-js>

<script src="https://cdn.jsdelivr.net/npm/aplayer/dist/APlayer.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/meting@2.0.1/dist/Meting.min.js"></script>
</body>
</html>
